<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能库 · 审小牛 AIAuditOx</title>
<meta name="description" content="审计技能库：按资产 Z / 负债 F / 权益 Q / 损益 S / 通用 A 五组组织，每个科目一个技能组，含六要素定义、程序分派表与程序卡。">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="page">
  <div class="container">

    <div class="page-head">
      <div class="page-head__eyebrow">Skill Library</div>
      <h1 class="page-head__title">技能库</h1>
      <p class="page-head__desc">
        按「组 → 报表项目 → 科目技能组」分级组织，每个技能组内含六要素、程序分派表与逐张程序卡。
      </p>
    </div>

    <!-- 工具条 -->
    <div class="toolbar" style="margin-bottom:14px">
      <label class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="input" id="search-input" type="search" placeholder="搜索科目、程序名称、索引号…" autocomplete="off">
      </label>
      <select class="select" id="sort-select" aria-label="排序方式">
        <option value="code">按索引号</option>
        <option value="name">按名称</option>
        <option value="procs">按程序卡数量</option>
      </select>
      <button class="btn btn--ghost" type="button" id="reset-btn">重置</button>
    </div>

    <!-- 筛选 -->
    <div class="card" style="margin-bottom:18px"><div class="card__body" style="padding:16px 18px">

      <div class="filter-row" id="cycle-filters" style="margin-bottom:12px">
        <span class="filter-label">组</span>
      </div>

      <div class="filter-row" id="group-filters" style="margin-bottom:12px">
        <span class="filter-label">报表项目</span>
      </div>

      <div class="filter-row" id="assertion-filters" style="margin-bottom:12px">
        <span class="filter-label">认定</span>
      </div>

      <div class="filter-row" id="mode-filters" style="margin-bottom:12px">
        <span class="filter-label">执行方式</span>
      </div>

      <div class="filter-row" id="tool-filters">
        <span class="filter-label">工具</span>
      </div>

    </div></div>

    <div class="result-count" id="result-count">加载中…</div>
    <div class="grid grid--cards" id="skill-list">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/skills.js"></script>
</body>
</html>
